[project]
name = "speech-proficiency-scoring"
version = "1.0.0"
description = "Explainable read-aloud pronunciation and fluency scoring with per-construct heads"
readme = "README.md"
license = "MIT"
authors = [{ name = "Justin Barber" }]
requires-python = ">=3.11"
# The base install trains, evaluates and scores from cached features on CPU.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "scikit-learn>=1.5",
    "scipy>=1.11",
    "librosa>=0.10",
    "soundfile>=0.12",
    "pronouncing>=0.2",
    "setuptools>=68",  # `pronouncing` imports pkg_resources
    "pydantic-settings>=2.3",
    "joblib>=1.3",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "tabulate>=0.9",
]

[project.optional-dependencies]
# Audio models for `extract` and `predict`. Pick one: `--extra cpu` or `--extra cu128`.
cpu = ["torch>=2.5", "torchaudio>=2.5", "openai-whisper>=20240930"]
cu128 = ["torch>=2.5", "torchaudio>=2.5", "openai-whisper>=20240930"]
llm = ["anthropic>=0.40"]

[project.scripts]
speech-score = "speech_scoring.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speech_scoring"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu128" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B905"]  # zip() over arrays built to equal length

[tool.pytest.ini_options]
testpaths = ["tests"]
